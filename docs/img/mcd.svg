<text x="30" y="742" font-size="14" font-weight="600" fill="#12332d" text-anchor="start">Comment lire le schéma</text>
<text x="30" y="768" font-size="12" font-weight="400" fill="#17221f" text-anchor="start">PASSER : un client passe 0 à N commandes ; une commande est passée par 1 seul client.</text>
<text x="30" y="788" font-size="12" font-weight="400" fill="#17221f" text-anchor="start">CONTENIR : une commande a 1 à N lignes (jamais vide) ; une cuvée est dans 0 à N commandes.</text>
<text x="30" y="808" font-size="12" font-weight="400" fill="#17221f" text-anchor="start">CONTENIR porte les attributs quantite et prix_unitaire : elle devient la table LIGNE_COMMANDE.</text>
<text x="30" y="828" font-size="12" font-weight="400" fill="#17221f" text-anchor="start">POSSEDER : une cuvée a un seul stock ; un stock concerne une seule cuvée (relation 1-1).</text>
<text x="630" y="768" font-size="12" font-weight="400" fill="#17221f" text-anchor="start">CONCERNER : un mouvement concerne 1 seule cuvée ; une cuvée a 0 à N mouvements.</text>
<text x="630" y="788" font-size="12" font-weight="400" fill="#17221f" text-anchor="start">GENERER : une commande génère 1 à N mouvements (sorties, ou entrées si annulée) ;</text>
<text x="630" y="808" font-size="12" font-weight="400" fill="#17221f" text-anchor="start">un mouvement vient de 0 ou 1 commande (0 pour une mise en bouteille).</text>
</svg>
